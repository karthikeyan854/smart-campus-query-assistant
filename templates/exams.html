{% extends "base.html" %}

{% block title %}Examination Results{% endblock %}

{% block content %}
<div class="glass" style="padding: 2rem;">
    <h2>Last Exam Result</h2>

    <div style="margin-top: 2rem;">
        <table style="width: 100%;">
            <tr>
                <td style="color: var(--text-secondary);">Exam Name</td>
                <td style="font-weight: bold;">{{ data['exam_name'] }}</td>
            </tr>
            <tr>
                <td style="color: var(--text-secondary);">Score</td>
                <td style="font-weight: bold;">{{ data['score'] }} / 100</td>
            </tr>
            <tr>
                <td style="color: var(--text-secondary);">Result</td>
                <td>
                    <span
                        style="padding: 4px 12px; border-radius: 20px; font-weight: bold; background: {{ 'rgba(16, 185, 129, 0.2)' if data['result'] == 'Pass' else 'rgba(239, 68, 68, 0.2)' }}; color: {{ '#10b981' if data['result'] == 'Pass' else '#ef4444' }};">
                        {{ data['result'] }}
                    </span>
                </td>
            </tr>
        </table>
    </div>
</div>
{% endblock %}
