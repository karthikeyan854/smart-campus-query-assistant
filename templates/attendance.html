{% extends "base.html" %}

{% block title %}Attendance{% endblock %}

{% block content %}
<div class="glass" style="padding: 2rem;">
    <h2>Attendance Record</h2>

    <div class="grid" style="margin-top: 2rem;">
        <div style="background: rgba(255,255,255,0.03); padding: 1.5rem; border-radius: 12px;">
            <h3>Total Classes</h3>
            <p style="font-size: 2rem; margin: 0.5rem 0;">{{ data['total_classes'] }}</p>
        </div>
        <div style="background: rgba(255,255,255,0.03); padding: 1.5rem; border-radius: 12px;">
            <h3>Attended</h3>
            <p style="font-size: 2rem; margin: 0.5rem 0; color: #3b82f6;">{{ data['attended_classes'] }}</p>
        </div>
        <div style="background: rgba(255,255,255,0.03); padding: 1.5rem; border-radius: 12px;">
            <h3>Percentage</h3>
            <p
                style="font-size: 2rem; margin: 0.5rem 0; color: {{ '#ef4444' if data['percentage'] < 75 else '#10b981' }};">
                {{ data['percentage']|round(1) }}%
            </p>
        </div>
    </div>
</div>
{% endblock %}
